<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account — ABC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
/* ==========================================================================
   WEXIRA — Design System
   Project Management & Team Collaboration Platform
   ========================================================================== */

:root {
  /* Color tokens */
  --wf-primary: #4f46e5;
  --wf-primary-600: #4338ca;
  --wf-primary-700: #4338ca;
  --wf-primary-50: #eef2ff;
  --wf-primary-100: #e0e7ff;
  --wf-bg: #f7f8fa;
  --wf-card: #ffffff;
  --wf-border: #e5e7eb;
  --wf-border-soft: #f0f1f4;
  --wf-text: #111827;
  --wf-text-secondary: #6b7280;
  --wf-text-tertiary: #9ca3af;
  --wf-success: #059669;
  --wf-success-50: #ecfdf5;
  --wf-warning: #d97706;
  --wf-warning-50: #fffbeb;
  --wf-error: #dc2626;
  --wf-error-50: #fef2f2;
  --wf-info: #0891b2;
  --wf-info-50: #ecfeff;
  --wf-purple: #7c3aed;
  --wf-purple-50: #f5f3ff;

  /* Shadow tokens */
  --wf-shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.04);
  --wf-shadow: 0 1px 3px rgba(16, 24, 40, 0.06), 0 1px 2px rgba(16, 24, 40, 0.04);
  --wf-shadow-md: 0 4px 6px -1px rgba(16, 24, 40, 0.08), 0 2px 4px -2px rgba(16, 24, 40, 0.05);
  --wf-shadow-lg: 0 10px 15px -3px rgba(16, 24, 40, 0.10), 0 4px 6px -4px rgba(16, 24, 40, 0.04);
  --wf-shadow-xl: 0 20px 25px -5px rgba(16, 24, 40, 0.12), 0 8px 10px -6px rgba(16, 24, 40, 0.04);

  /* Radius tokens */
  --wf-radius-sm: 6px;
  --wf-radius: 8px;
  --wf-radius-md: 10px;
  --wf-radius-lg: 12px;
  --wf-radius-xl: 16px;
  --wf-radius-full: 9999px;

  --wf-sidebar-w: 248px;
  --wf-sidebar-w-collapsed: 72px;
  --wf-navbar-h: 64px;
}

/* --------------------------------------------------------------------
   Base
   -------------------------------------------------------------------- */
* {
  scrollbar-width: thin;
  scrollbar-color: #d1d5db transparent;
}

*::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
*::-webkit-scrollbar-thumb {
  background: #d1d5db;
  border-radius: 8px;
}
*::-webkit-scrollbar-track {
  background: transparent;
}

html, body {
  height: 100%;
  margin: 0;
}

body {
  font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  background: var(--wf-bg);
  color: var(--wf-text);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

button { font-family: inherit; }
a { text-decoration: none; color: inherit; }

/* --------------------------------------------------------------------
   Layout shell
   -------------------------------------------------------------------- */
.wf-shell {
  display: flex;
  min-height: 100vh;
}

.wf-sidebar {
  width: var(--wf-sidebar-w);
  background: var(--wf-card);
  border-right: 1px solid var(--wf-border);
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  z-index: 40;
  display: flex;
  flex-direction: column;
  transition: width .2s cubic-bezier(.4,0,.2,1);
  overflow: hidden;
}

.wf-sidebar.is-collapsed {
  width: var(--wf-sidebar-w-collapsed);
}

.wf-main {
  flex: 1;
  margin-left: var(--wf-sidebar-w);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  transition: margin-left .2s cubic-bezier(.4,0,.2,1);
}

.wf-main.is-collapsed {
  margin-left: var(--wf-sidebar-w-collapsed);
}

.wf-content {
  padding: 24px 32px 48px;
  flex: 1;
  max-width: 1600px;
  width: 100%;
  margin: 0 auto;
}

/* Sidebar logo */
.wf-logo {
  height: var(--wf-navbar-h);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 16px;
  border-bottom: 1px solid var(--wf-border-soft);
}

.wf-logo-mark {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  flex: none;
  box-shadow: 0 4px 10px rgba(79, 70, 229, .35);
}

.wf-logo-text {
  font-weight: 700;
  font-size: 17px;
  letter-spacing: -0.02em;
  white-space: nowrap;
}

.wf-logo-text span { color: var(--wf-primary); }

/* Sidebar nav */
.wf-nav {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 12px 12px;
}

.wf-nav-section {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--wf-text-tertiary);
  padding: 16px 12px 6px;
  white-space: nowrap;
}

.wf-nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 12px;
  margin: 1px 0;
  border-radius: var(--wf-radius);
  color: var(--wf-text-secondary);
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  position: relative;
  transition: background .12s, color .12s;
}

.wf-nav-item:hover { background: #f3f4f6; color: var(--wf-text); }

.wf-nav-item.is-active {
  background: var(--wf-primary-50);
  color: var(--wf-primary-700);
  font-weight: 600;
}

.wf-nav-item.is-active::before {
  content: '';
  position: absolute;
  left: -12px;
  top: 6px;
  bottom: 6px;
  width: 3px;
  border-radius: 0 3px 3px 0;
  background: var(--wf-primary);
}

.wf-nav-item svg { flex: none; }

.wf-nav-item .wf-nav-badge {
  margin-left: auto;
  background: var(--wf-error);
  color: #fff;
  font-size: 10.5px;
  font-weight: 600;
  padding: 1px 7px;
  border-radius: var(--wf-radius-full);
}

.wf-sidebar.is-collapsed .wf-nav-label,
.wf-sidebar.is-collapsed .wf-nav-section,
.wf-sidebar.is-collapsed .wf-nav-badge,
.wf-sidebar.is-collapsed .wf-logo-text,
.wf-sidebar.is-collapsed .wf-sidebar-bottom-text {
  display: none;
}

.wf-sidebar.is-collapsed .wf-nav-item { justify-content: center; padding: 10px; }
.wf-sidebar.is-collapsed .wf-nav-section { padding: 8px; height: 4px; }

.wf-sidebar-bottom {
  padding: 12px;
  border-top: 1px solid var(--wf-border-soft);
}

#sidebarCollapseBtn {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 12px;
  border-radius: var(--wf-radius);
  background: none;
  border: none;
  color: var(--wf-text-secondary);
  cursor: pointer;
  font-size: 13.5px;
  font-weight: 500;
}
#sidebarCollapseBtn:hover { background: #f3f4f6; color: var(--wf-text); }
.wf-sidebar.is-collapsed #sidebarCollapseBtn { justify-content: center; }

.wf-profile-card {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: var(--wf-radius);
  cursor: pointer;
}
.wf-profile-card:hover { background: #f3f4f6; }

/* --------------------------------------------------------------------
   Top navbar
   -------------------------------------------------------------------- */
.wf-navbar {
  height: var(--wf-navbar-h);
  background: var(--wf-card);
  border-bottom: 1px solid var(--wf-border-soft);
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 32px;
  position: sticky;
  top: 0;
  z-index: 30;
}

.wf-search {
  flex: 1;
  max-width: 460px;
  display: flex;
  align-items: center;
  gap: 10px;
  background: #f1f2f4;
  border: 1px solid transparent;
  border-radius: var(--wf-radius);
  padding: 0 12px;
  height: 38px;
  color: var(--wf-text-tertiary);
  transition: border .15s, background .15s, box-shadow .15s;
}

.wf-search:focus-within {
  background: #fff;
  border-color: var(--wf-primary);
  box-shadow: 0 0 0 3px rgba(79,70,229,.15);
}

.wf-search input {
  border: none;
  outline: none;
  background: transparent;
  flex: 1;
  font-size: 13.5px;
  color: var(--wf-text);
}
.wf-search input::placeholder { color: var(--wf-text-tertiary); }

.wf-icon-btn {
  position: relative;
  width: 38px;
  height: 38px;
  border-radius: var(--wf-radius);
  border: 1px solid var(--wf-border);
  background: var(--wf-card);
  color: var(--wf-text-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all .12s;
}
.wf-icon-btn:hover { background: #f3f4f6; color: var(--wf-text); }

.wf-navbar .wf-user {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 8px 4px 4px;
  border-radius: var(--wf-radius-full);
  cursor: pointer;
}
.wf-navbar .wf-user:hover { background: #f3f4f6; }

/* --------------------------------------------------------------------
   Buttons
   -------------------------------------------------------------------- */
.wf-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 14px;
  border-radius: var(--wf-radius);
  font-size: 13.5px;
  font-weight: 600;
  border: 1px solid transparent;
  cursor: pointer;
  transition: all .12s;
  white-space: nowrap;
}
.wf-btn:active { transform: translateY(1px); }
.wf-btn:disabled { opacity: .5; cursor: not-allowed; }

.wf-btn-primary {
  background: var(--wf-primary);
  color: #fff;
  box-shadow: var(--wf-shadow-sm);
}
.wf-btn-primary:hover { background: var(--wf-primary-600); }

.wf-btn-secondary {
  background: var(--wf-card);
  border-color: var(--wf-border);
  color: var(--wf-text);
}
.wf-btn-secondary:hover { background: #f3f4f6; }

.wf-btn-ghost { background: transparent; color: var(--wf-text-secondary); }
.wf-btn-ghost:hover { background: #f3f4f6; color: var(--wf-text); }

.wf-btn-danger { background: var(--wf-error); color: #fff; }
.wf-btn-danger:hover { background: #b91c1c; }

.wf-btn-sm { padding: 5px 10px; font-size: 12.5px; gap: 6px; }
.wf-btn-xs { padding: 3px 8px; font-size: 11.5px; gap: 5px; }

/* --------------------------------------------------------------------
   Cards
   -------------------------------------------------------------------- */
.wf-card {
  background: var(--wf-card);
  border: 1px solid var(--wf-border);
  border-radius: var(--wf-radius-lg);
  box-shadow: var(--wf-shadow-sm);
}

.wf-card-pad { padding: 20px; }

.wf-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 20px;
  border-bottom: 1px solid var(--wf-border-soft);
}

/* --------------------------------------------------------------------
   Badges & status
   -------------------------------------------------------------------- */
.wf-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 2px 9px;
  border-radius: var(--wf-radius-full);
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  line-height: 1.6;
}

.wf-status {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  border-radius: var(--wf-radius-full);
  font-size: 12px;
  font-weight: 600;
  line-height: 1.55;
}
.wf-status .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
}

.wf-status-todo    { background: #eef2ff; color: #4f46e5; }
.wf-status-progress{ background: #ecfeff; color: #0891b2; }
.wf-status-review  { background: #f5f3ff; color: #7c3aed; }
.wf-status-done    { background: #ecfdf5; color: #059669; }
.wf-status-blocked { background: #fef2f2; color: #dc2626; }

.wf-prio-low      { background: #eef2ff; color: #4f46e5; }
.wf-prio-medium   { background: #ecfeff; color: #0891b2; }
.wf-prio-high     { background: #fffbeb; color: #d97706; }
.wf-prio-critical { background: #fef2f2; color: #dc2626; }

.wf-badge-soft-blue   { background: #eef2ff; color: #4338ca; }
.wf-badge-soft-grape  { background: #f5f3ff; color: #6d28d9; }
.wf-badge-soft-green  { background: #ecfdf5; color: #047857; }
.wf-badge-soft-amber  { background: #fffbeb; color: #b45309; }
.wf-badge-soft-red    { background: #fef2f2; color: #b91c1c; }
.wf-badge-soft-cyan   { background: #ecfeff; color: #0e7490; }
.wf-badge-soft-gray   { background: #f3f4f6; color: #4b5563; }

/* --------------------------------------------------------------------
   Avatars
   -------------------------------------------------------------------- */
.wf-avatar {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  color: #fff;
  font-size: 11px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: none;
  border: 2px solid #fff;
}
.wf-avatar-sm { width: 26px; height: 26px; font-size: 10px; }
.wf-avatar-lg { width: 40px; height: 40px; font-size: 14px; }
.wf-avatar-xl { width: 56px; height: 56px; font-size: 18px; }

.wf-avatar-group { display: flex; }
.wf-avatar-group .wf-avatar { margin-left: -7px; }
.wf-avatar-group .wf-avatar:first-child { margin-left: 0; }

/* --------------------------------------------------------------------
   Tables
   -------------------------------------------------------------------- */
.wf-table { width: 100%; border-collapse: collapse; }
.wf-table th {
  text-align: left;
  font-size: 11.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .05em;
  color: var(--wf-text-secondary);
  padding: 10px 14px;
  background: #fafafb;
  border-bottom: 1px solid var(--wf-border);
  white-space: nowrap;
}
.wf-table td {
  padding: 13px 14px;
  border-bottom: 1px solid var(--wf-border-soft);
  font-size: 13.5px;
  vertical-align: middle;
}
.wf-table tbody tr { transition: background .1s; }
.wf-table tbody tr:hover { background: #fafafb; }
.wf-table tbody tr:last-child td { border-bottom: none; }

/* --------------------------------------------------------------------
   Progress
   -------------------------------------------------------------------- */
.wf-progress-track {
  height: 7px;
  border-radius: var(--wf-radius-full);
  background: #eef0f3;
  overflow: hidden;
  flex: 1;
  min-width: 60px;
}
.wf-progress-bar {
  height: 100%;
  border-radius: var(--wf-radius-full);
  transition: width .4s ease;
}

.wf-progress-ring {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.wf-progress-ring circle { transition: stroke-dashoffset .5s ease; }

/* --------------------------------------------------------------------
   Kanban
   -------------------------------------------------------------------- */
.wf-board {
  display: flex;
  gap: 16px;
  overflow-x: auto;
  padding-bottom: 12px;
  align-items: flex-start;
}

.wf-column {
  width: 290px;
  flex: none;
  background: #eef0f3;
  border-radius: var(--wf-radius-lg);
  display: flex;
  flex-direction: column;
  min-height: 70vh;
}

.wf-column-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 14px 14px 10px;
}
.wf-column-count {
  background: var(--wf-card);
  border: 1px solid var(--wf-border);
  color: var(--wf-text-secondary);
  font-size: 11.5px;
  font-weight: 600;
  padding: 1px 8px;
  border-radius: var(--wf-radius-full);
}
.wf-column-wip {
  margin-left: auto;
  font-size: 11px;
  color: var(--wf-text-tertiary);
  font-weight: 500;
}

.wf-column-body {
  padding: 4px 10px 14px;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 120px;
}

.wf-column.is-dragover .wf-column-body {
  outline: 2px dashed var(--wf-primary);
  outline-offset: -4px;
  border-radius: var(--wf-radius);
  background: rgba(79,70,229,.04);
}

.wf-column-empty {
  border: 2px dashed var(--wf-border);
  border-radius: var(--wf-radius);
  padding: 24px 12px;
  text-align: center;
  color: var(--wf-text-tertiary);
  font-size: 12.5px;
}

/* Task card */
.wf-issue-card {
  background: var(--wf-card);
  border: 1px solid var(--wf-border);
  border-radius: var(--wf-radius);
  padding: 12px;
  box-shadow: var(--wf-shadow-sm);
  cursor: grab;
  transition: box-shadow .12s, border-color .12s, transform .12s;
}
.wf-issue-card:hover {
  box-shadow: var(--wf-shadow-md);
  border-color: #d1d5db;
}
.wf-issue-card.is-selected {
  border-color: var(--wf-primary);
  box-shadow: 0 0 0 3px rgba(79,70,229,.18);
}
.wf-issue-card.is-dragging {
  opacity: .55;
  transform: rotate(2deg) scale(1.02);
  box-shadow: var(--wf-shadow-lg);
  border-color: var(--wf-primary);
}

.issue-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.issue-id {
  font-size: 12px;
  font-weight: 600;
  color: var(--wf-text-tertiary);
}
.issue-prio-dot {
  width: 10px; height: 10px;
  border-radius: 3px;
}

.issue-card-title {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--wf-text);
  margin-bottom: 10px;
  line-height: 1.4;
}

.issue-card-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }

.issue-card-footer {
  display: flex;
  align-items: center;
  gap: 8px;
}
.issue-points {
  background: #f3f4f6;
  border-radius: 4px;
  padding: 1px 6px;
  font-size: 11px;
  font-weight: 600;
  color: var(--wf-text-secondary);
}
.issue-due {
  font-size: 11.5px;
  color: var(--wf-text-tertiary);
  display: flex;
  align-items: center;
  gap: 4px;
}
.issue-due.urgent { color: var(--wf-error); font-weight: 600; }
.issue-card-footer .wf-avatar { margin-left: auto; }

/* --------------------------------------------------------------------
   Forms
   -------------------------------------------------------------------- */
.wf-label {
  display: block;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--wf-text);
  margin-bottom: 6px;
}
.wf-label .req { color: var(--wf-error); }

.wf-input, .wf-select, .wf-textarea {
  width: 100%;
  border: 1px solid var(--wf-border);
  border-radius: var(--wf-radius);
  padding: 9px 12px;
  font-size: 13.5px;
  font-family: inherit;
  color: var(--wf-text);
  background: #fff;
  outline: none;
  transition: border .12s, box-shadow .12s;
}
.wf-input:focus, .wf-select:focus, .wf-textarea:focus {
  border-color: var(--wf-primary);
  box-shadow: 0 0 0 3px rgba(79,70,229,.15);
}
.wf-input::placeholder, .wf-textarea::placeholder { color: var(--wf-text-tertiary); }
.wf-input.is-invalid { border-color: var(--wf-error); }
.wf-help { font-size: 12px; color: var(--wf-text-secondary); margin-top: 5px; }
.wf-field { margin-bottom: 16px; }

.wf-checkbox {
  width: 16px; height: 16px;
  accent-color: var(--wf-primary);
  cursor: pointer;
}

/* --------------------------------------------------------------------
   Tabs
   -------------------------------------------------------------------- */
.wf-tabs {
  display: flex;
  gap: 2px;
  border-bottom: 1px solid var(--wf-border);
  background: var(--wf-card);
}
.wf-tab {
  padding: 11px 14px;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--wf-text-secondary);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  display: flex;
  align-items: center;
  gap: 7px;
}
.wf-tab:hover { color: var(--wf-text); }
.wf-tab.is-active {
  color: var(--wf-primary);
  border-bottom-color: var(--wf-primary);
}

/* --------------------------------------------------------------------
   Chat
   -------------------------------------------------------------------- */
.wf-chat-bubble {
  max-width: 78%;
  padding: 12px 14px;
  border-radius: var(--wf-radius-lg);
  font-size: 13.5px;
  line-height: 1.6;
  white-space: pre-line;
}
.wf-chat-user {
  background: var(--wf-primary);
  color: #fff;
  border-bottom-right-radius: 4px;
  align-self: flex-end;
}
.wf-chat-ai {
  background: var(--wf-card);
  border: 1px solid var(--wf-border);
  border-bottom-left-radius: 4px;
  align-self: flex-start;
  box-shadow: var(--wf-shadow-sm);
}

.wf-typing { display: inline-flex; gap: 5px; padding: 4px 2px; }
.wf-typing span {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--wf-text-tertiary);
  animation: wf-blink 1.2s infinite;
}
.wf-typing span:nth-child(2) { animation-delay: .2s; }
.wf-typing span:nth-child(3) { animation-delay: .4s; }

@keyframes wf-blink {
  0%, 80%, 100% { opacity: .25; transform: translateY(0); }
  40% { opacity: 1; transform: translateY(-3px); }
}

/* --------------------------------------------------------------------
   Animations
   -------------------------------------------------------------------- */
@keyframes wf-fade-up {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.wf-fade-up { animation: wf-fade-up .25s ease both; }

@keyframes wf-pop {
  from { opacity: 0; transform: scale(.96); }
  to { opacity: 1; transform: scale(1); }
}
.wf-pop { animation: wf-pop .18s ease both; }

/* Modal */
.wf-modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(17, 24, 39, .5);
  backdrop-filter: blur(2px);
  z-index: 60;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: 48px 24px;
  overflow-y: auto;
}

.wf-modal {
  background: var(--wf-card);
  border-radius: var(--wf-radius-xl);
  box-shadow: var(--wf-shadow-xl);
  width: 100%;
  max-width: 640px;
  animation: wf-pop .18s ease both;
}

/* Drawer */
.wf-drawer-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(17,24,39,.32);
  z-index: 55;
  animation: wf-fade 0   .2s ease both;
}
@keyframes wf-fade { from { opacity: 0 } to { opacity: 1 } }

.wf-drawer {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: 420px;
  max-width: 92vw;
  background: var(--wf-card);
  box-shadow: var(--wf-shadow-xl);
  z-index: 56;
  display: flex;
  flex-direction: column;
  animation: wf-slide-in .22s cubic-bezier(.4,0,.2,1) both;
}
@keyframes wf-slide-in {
  from { transform: translateX(100%); }
  to { transform: translateX(0); }
}

/* Floating AI button */
.wf-fab {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 50;
  width: 54px;
  height: 54px;
  border-radius: 50%;
  background: linear-gradient(135deg, #4f46e5, #7c3aed);
  color: #fff;
  border: none;
  box-shadow: 0 8px 20px rgba(79,70,229,.45);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform .15s;
}
.wf-fab:hover { transform: scale(1.06); }

/* Toast */
.wf-toast-wrap {
  position: fixed;
  top: 76px;
  right: 24px;
  z-index: 90;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.wf-toast {
  background: var(--wf-card);
  border: 1px solid var(--wf-border);
  border-left: 4px solid var(--wf-primary);
  border-radius: var(--wf-radius);
  box-shadow: var(--wf-shadow-lg);
  padding: 12px 16px;
  min-width: 300px;
  max-width: 380px;
  display: flex;
  gap: 10px;
  align-items: flex-start;
  animation: wf-fade-up .2s ease both;
}
.wf-toast.success { border-left-color: var(--wf-success); }
.wf-toast.error { border-left-color: var(--wf-error); }
.wf-toast.warning { border-left-color: var(--wf-warning); }

/* Timeline */
.wf-timeline { position: relative; padding-left: 24px; }
.wf-timeline::before {
  content: '';
  position: absolute;
  left: 8px;
  top: 4px;
  bottom: 4px;
  width: 2px;
  background: var(--wf-border);
}
.wf-timeline-item { position: relative; padding-bottom: 20px; }
.wf-timeline-item::before {
  content: '';
  position: absolute;
  left: -24px;
  top: 4px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--wf-card);
  border: 2px solid var(--wf-border);
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Dropdown menus */
.wf-menu {
  position: absolute;
  z-index: 50;
  background: var(--wf-card);
  border: 1px solid var(--wf-border);
  border-radius: var(--wf-radius);
  box-shadow: var(--wf-shadow-lg);
  padding: 5px;
  min-width: 200px;
  animation: wf-pop .12s ease both;
}
.wf-menu-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 8px 10px;
  border-radius: 6px;
  font-size: 13px;
  color: var(--wf-text);
  background: none;
  border: none;
  cursor: pointer;
  text-align: left;
}
.wf-menu-item:hover { background: #f3f4f6; }
.wf-menu-item.danger { color: var(--wf-error); }

/* KPI cards */
.wf-kpi {
  position: relative;
  overflow: hidden;
}
.wf-kpi-icon {
  width: 42px;
  height: 42px;
  border-radius: var(--wf-radius);
  display: flex;
  align-items: center;
  justify-content: center;
  flex: none;
}

/* Empty states */
.wf-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 44px 24px;
  gap: 8px;
}

/* Util */
.wf-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: #f3f4f6;
  border-radius: var(--wf-radius-full);
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 500;
  color: var(--wf-text-secondary);
}

.animate-pulse-soft { animation: wf-pulse 1.6s ease-in-out infinite; }
@keyframes wf-pulse { 0%,100% { opacity: 1 } 50% { opacity: .5 } }

/* --------------------------------------------------------------------
   Responsive
   -------------------------------------------------------------------- */
@media (max-width: 1280px) {
  .wf-content { padding: 20px 24px 40px; }
  .wf-column { width: 268px; }
}

@media (max-width: 1024px) {
  .wf-sidebar { width: var(--wf-sidebar-w-collapsed); }
  .wf-sidebar .wf-nav-label,
  .wf-sidebar .wf-nav-section,
  .wf-sidebar .wf-nav-badge,
  .wf-sidebar .wf-logo-text,
  .wf-sidebar .wf-sidebar-bottom-text { display: none; }
  .wf-sidebar .wf-nav-item { justify-content: center; padding: 10px; }
  .wf-main { margin-left: var(--wf-sidebar-w-collapsed); }
}

@media (max-width: 780px) {
  .wf-navbar { padding: 0 16px; gap: 10px; }
  .wf-search .wf-search-kbd { display: none; }
  .wf-navbar .wf-user-name, .wf-navbar .wf-role { display: none; }
  .wf-content { padding: 16px 16px 96px; }
  .wf-board { gap: 12px; }
}

@media (max-width: 640px) {
  .wf-fab { bottom: 84px; right: 16px; }
  .wf-content { padding-bottom: 120px; }
  .wf-tab { font-size: 12.5px; padding: 10px; }
}
  </style>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .login-bg {
      background:
        radial-gradient(600px 300px at 85% 8%, rgba(79,70,229,.08), transparent 60%),
        radial-gradient(500px 300px at 8% 90%, rgba(124,58,237,.07), transparent 60%),
        #f7f8fa;
    }
  </style>
</head>
<body class="login-bg min-h-screen flex flex-col">
  <div class="flex-1 flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-md">
      <div class="mb-8 text-center">
        <a href="/" class="inline-flex items-center gap-2.5">
          <!-- TODO: Replace this placeholder square with the real logo -->
          <span class="w-11 h-11 rounded-xl grid place-items-center" style="background:#e5e7eb;border:2px solid var(--wf-border)">
          </span>
          <span class="text-[22px] font-extrabold text-[var(--wf-text)] tracking-tight">ABC</span>
        </a>
      </div>

      <div class="bg-white rounded-2xl border border-[var(--wf-border)] shadow-sm p-8">
        <h1 class="text-[20px] font-bold text-[var(--wf-text)]">Create your account</h1>
        <p class="text-[13px] text-[var(--wf-text-secondary)] mt-1.5 mb-7">Start collaborating with your team today.</p>

        <div id="registerMessage" class="mb-4 hidden"></div>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
          <div class="mb-4 rounded-lg px-4 py-3 text-[13px] font-medium {{ 'bg-[#fef2f2] text-[#dc2626] border border-[#fecaca]' if category == 'error' else 'bg-[#ecfdf5] text-[#059669] border border-[#a7f3d0]' }}">
            {{ message }}
          </div>
          {% endfor %}
        {% endwith %}

        <form method="POST" action="/register" id="registerForm">
          <div class="wf-field">
            <label class="wf-label" for="regName">Full name</label>
            <input class="wf-input" id="regName" name="name" type="text" placeholder="Jane Doe" autocomplete="name" required>
          </div>
          <div class="wf-field">
            <label class="wf-label" for="regEmail">Work email</label>
            <input class="wf-input" id="regEmail" name="email" type="email" placeholder="you@company.com" autocomplete="email" required>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-3">
            <div class="wf-field">
              <label class="wf-label" for="regRole">Role</label>
              <select class="wf-select" id="regRole" name="role" required>
                <option value="">Select…</option>
                <option>Project Manager</option>
                <option>Frontend Developer</option>
                <option>Backend Developer</option>
                <option>UI/UX Designer</option>
                <option>QA Engineer</option>
                <option>DevOps Engineer</option>
                <option>Product Manager</option>
                <option>Other</option>
              </select>
            </div>
            <div class="wf-field">
              <label class="wf-label" for="regTeam">Team</label>
              <input class="wf-input" id="regTeam" name="team" type="text" placeholder="Platform">
            </div>
          </div>
          <div class="wf-field">
            <div class="flex items-center justify-between mb-1.5">
              <label class="wf-label mb-0" for="regPass">Password</label>
            </div>
            <div class="relative">
              <input class="wf-input pr-10" id="regPass" name="password" type="password" placeholder="Minimum 8 characters" autocomplete="new-password" required>
              <button type="button" id="toggleRegPass" class="absolute right-3 top-1/2 -translate-y-1/2 text-[var(--wf-text-tertiary)] hover:text-[var(--wf-text-secondary)]" style="background:none;border:none;cursor:pointer">
                <i data-lucide="eye" style="width:16px;height:16px"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="wf-btn wf-btn-primary w-full justify-center py-2.5 mb-3">
            <span class="inline-flex items-center gap-2"><i data-lucide="user-plus" style="width:16px;height:16px"></i> Create account</span>
          </button>

          <p class="text-center text-[13px] text-[var(--wf-text-secondary)] mt-2">
            Already have an account? <a href="/login" class="font-semibold text-[var(--wf-primary)] hover:underline">Sign in</a>
          </p>
        </form>
      </div>

      <p class="text-center text-[11.5px] text-[var(--wf-text-tertiary)] mt-6">
        <i data-lucide="lock" style="width:11px;height:11px;display:inline;vertical-align:-1px"></i> Secured by ABC · Enterprise Grade
      </p>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
  <script>
    document.getElementById('toggleRegPass').addEventListener('click', () => {
      const el = document.getElementById('regPass');
      el.type = el.type === 'password' ? 'text' : 'password';
      lucide.createIcons();
    });
    lucide.createIcons();

    (function () {
      const form = document.getElementById('registerForm');
      const msgEl = document.getElementById('registerMessage');
      const submitBtn = form.querySelector('[type="submit"]');

      function showMsg(message, ok) {
        if (!msgEl) return;
        msgEl.classList.remove('hidden');
        msgEl.className = 'mb-4 rounded-lg px-4 py-3 text-[13px] font-medium ' + (ok
          ? 'bg-[#ecfdf5] text-[#059669] border border-[#a7f3d0]'
          : 'bg-[#fef2f2] text-[#dc2626] border border-[#fecaca]');
        msgEl.textContent = message;
      }

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const btnText = submitBtn.innerHTML;
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="inline-flex items-center gap-2">Creating account…</span>';
        API.post('/api/v1/auth/register', {
          name: document.getElementById('regName').value.trim(),
          email: document.getElementById('regEmail').value.trim(),
          password: document.getElementById('regPass').value,
          role: document.getElementById('regRole').value,
          team: document.getElementById('regTeam').value.trim()
        }).then((r) => {
          if (r.ok) {
            window.location.href = (r.data && r.data.redirect) || '/dashboard';
          } else {
            showMsg((r.data && r.data.error) || 'Please fill in all required fields.', false);
          }
        }).catch(() => {
          showMsg('Could not connect. Please try again.', false);
        }).finally(() => {
          submitBtn.disabled = false;
          submitBtn.innerHTML = btnText;
        });
      });
    })();
  </script>
</body>
</html>
